<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DocuSafe" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <title>DocuSafe - Personal Document Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root">
      <!-- Initial Loading Skeleton so user NEVER sees a pure white screen -->
      <div id="initial-loader" style="min-height: 100vh; background-color: #0f172a; color: #94a3b8; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(135deg, #0284c7, #0f172a); border: 2px solid #38bdf8; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h2 style="color: #ffffff; font-size: 1.25rem; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.02em;">DocuSafe Vault</h2>
        <p style="color: #64748b; font-size: 0.875rem; margin: 0; max-width: 320px;">Decrypting and loading documents for Ashraf Ahmed...</p>
      </div>
    </div>

    <script>
      // Global error handler to display error on screen if any script fails
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.innerHTML = '<div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 16px; max-width: 400px; color: #fca5a5; text-align: left; font-size: 13px;">' +
            '<strong style="color: #ef4444; display: block; margin-bottom: 6px;">App Initialization Notice</strong>' +
            '<div>' + (e.message || 'Script error') + '</div>' +
            '<button onclick="location.reload()" style="margin-top: 12px; padding: 6px 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Reload Vault</button>' +
            '</div>';
        }
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .catch(function(err) {
              console.log('SW registration note:', err);
            });
        });
      }
    </script>
  </body>
</html>
