<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DocuSafe" />
    <link rel="icon" type="image/svg+xml" href="/Document-safe/icon.svg" />
    <link rel="apple-touch-icon" href="/Document-safe/icon.svg" />
    <link rel="manifest" href="/Document-safe/manifest.json" />
    <title>DocuSafe — Personal Document Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/Document-safe/assets/index-BFlL8uxf.js"></script>
    <link rel="stylesheet" crossorigin href="/Document-safe/assets/index-C1z3xkIz.css">
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swPath = './sw.js';
          navigator.serviceWorker.register(swPath)
            .then((registration) => {
              console.log('DocuSafe SW registered with scope: ', registration.scope);
            })
            .catch((err) => {
              console.log('DocuSafe SW registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
