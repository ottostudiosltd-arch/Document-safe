<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8D5050" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyDocs" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./pwa-192x192.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>MyDocs - Your Important Documents Always Safe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FBF8F5] text-[#3E2F28] antialiased selection:bg-[#D5A7A7] selection:text-[#3E2F28] min-h-screen">
    <div id="root">
      <!-- Branded Warm Initial Skeleton matching Image 2 -->
      <div id="initial-loader" style="min-height: 100vh; background-color: #FBF8F5; color: #7A665A; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 18px; background-color: #8D5050; border: 2px solid #D5A7A7; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(141, 80, 80, 0.25);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
            <circle cx="12" cy="13" r="2"/>
          </svg>
        </div>
        <h2 style="color: #3E2F28; font-size: 1.35rem; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -0.02em;">MyDocs</h2>
        <p style="color: #7A665A; font-size: 0.875rem; margin: 0; max-width: 320px;">Your Important Documents Always Safe...</p>
      </div>
    </div>

    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.innerHTML = '<div style="background: #F7EBEB; border: 1px solid #EBD4D4; border-radius: 16px; padding: 18px; max-width: 380px; color: #743E3E; text-align: left; font-size: 13px;">' +
            '<strong style="color: #8D5050; display: block; margin-bottom: 6px;">Notice</strong>' +
            '<div>' + (e.message || 'Initializing vault...') + '</div>' +
            '<button onclick="location.reload()" style="margin-top: 12px; padding: 7px 16px; background: #8D5050; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;">Reload Vault</button>' +
            '</div>';
        }
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .catch(function(err) {
              console.log('SW note:', err);
            });
        });
      }
    </script>
  </body>
</html>
