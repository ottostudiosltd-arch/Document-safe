<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Top Indian Flag Header Band -->
  <rect x="0" y="0" width="320" height="8" rx="4" fill="#FF9933"/>
  <rect x="0" y="8" width="320" height="8" fill="#ffffff"/>
  <rect x="0" y="16" width="320" height="8" fill="#138808"/>
  <!-- Govt header -->
  <text x="160" y="42" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">GOVERNMENT OF INDIA</text>
  <text x="160" y="55" font-family="sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">Unique Identification Authority of India</text>
  <!-- Photo placeholder -->
  <rect x="20" y="70" width="60" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="50" cy="98" r="14" fill="#94a3b8"/>
  <path d="M30 135 C30 120 70 120 70 135 Z" fill="#94a3b8"/>
  <!-- Details lines -->
  <rect x="95" y="75" width="120" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="95" y="93" width="90" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="95" y="107" width="100" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="95" y="121" width="70" height="8" rx="2" fill="#e2e8f0"/>
  <!-- Red Aadhaar Fingerprint Icon -->
  <g transform="translate(230, 80) scale(0.7)">
    <circle cx="40" cy="40" r="32" fill="#fee2e2"/>
    <path d="M40 20 C28 20 20 30 20 42 C20 54 28 64 40 64 C52 64 60 54 60 42 C60 30 52 20 40 20 Z" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="4 2"/>
    <path d="M40 28 C34 28 30 34 30 42 C30 50 34 56 40 56 C46 56 50 50 50 42" fill="none" stroke="#dc2626" stroke-width="3"/>
  </g>
  <!-- Aadhaar Number Footer -->
  <rect x="0" y="160" width="320" height="40" rx="0" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="160" y="184" font-family="monospace" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="3">6431 •••• 4663</text>
